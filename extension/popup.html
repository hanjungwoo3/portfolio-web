<!doctype html>
<meta charset="utf-8">
<title>포트폴리오</title>
<style>
  html, body { margin: 0; width: 780px; height: 580px; overflow: hidden;
               font: 12px system-ui, -apple-system, sans-serif; background: #fff; }
  #bar { display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 8px;
         border-bottom: 1px solid #e5e7eb; background: #f9fafb; }
  #st { font-weight: 700; }
  #st.on  { color: #059669; }
  #st.off { color: #9ca3af; }
  #bar button { margin-left: auto; font: inherit; padding: 2px 8px; cursor: pointer;
                border: 1px solid #d1d5db; border-radius: 4px; background: #fff; }
  #bar button:hover { background: #f3f4f6; }
  iframe { width: 780px; height: 554px; border: 0; display: block; }
</style>
<div id="bar">
  <span id="st" class="off">● 프록시 연결 확인 중</span>
  <button id="tab">새 탭에서 열기 ↗</button>
</div>
<iframe id="app" src="https://hanjungwoo3.github.io/portfolio-web/"></iframe>
