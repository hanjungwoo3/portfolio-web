[package]
name = "portfolio"
version = "0.1.4"
description = "포트폴리오 데스크톱 앱"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "gzip", "brotli", "deflate"] }
base64 = "0.22"
open = "5"
sha2 = "0.10"
rand = "0.8"
serde_json = "1"
tauri-plugin-updater = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
