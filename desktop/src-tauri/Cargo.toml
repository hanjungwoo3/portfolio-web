[package]
name = "portfolio"
version = "0.1.10"
description = "포트폴리오 데스크톱 앱"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "gzip", "brotli", "deflate"] }
base64 = "0.22"
open = "5"
sha2 = "0.10"
rand = "0.8"
serde_json = "1"
tauri-plugin-updater = "2"
# 증권사 키 저장 — 맥 키체인 / 윈도우 자격 증명 관리자(src/broker.rs)
keyring = { version = "3", features = ["apple-native", "windows-native"] }
tokio = { version = "1", features = ["time"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"   # 키체인 항목을 비밀 안 읽고 지우기(delete_noread) — keyring 의 delete 는 읽어서 허용 창이 뜬다
